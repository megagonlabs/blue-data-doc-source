[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-doc-cli"
version = "1.0.0"
description = "Command-line interface for blue-data-doc-source"
requires-python = ">=3.10"
dependencies = [
    "blue-data-doc-source>=1.0.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
redis  = ["redis[hiredis]>=4.5.0"]
dev    = ["pytest"]

[project.scripts]
blue-docdb = "blue_data_doc_cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
