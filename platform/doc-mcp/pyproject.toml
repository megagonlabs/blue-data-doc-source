[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-doc-mcp"
version = "1.0.0"
description = "MCP server for blue-data-doc-source"
requires-python = ">=3.10"
dependencies = [
    "blue-data-doc-source>=1.0.0",
    # mcp 2.x removed mcp.server.fastmcp; server.py targets the v1 FastMCP API. See #76.
    "mcp>=1.28.1,<2",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
redis  = ["redis[hiredis]>=4.5.0"]
dev    = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["server"]
