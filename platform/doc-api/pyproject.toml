[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-doc-api"
version = "0.1.0"
description = "REST API for blue-data-doc-source"
requires-python = ">=3.10"
dependencies = [
    "blue-data-doc-source>=0.1.0",
    # Shared server policy: loopback bind, API-key auth, CSRF guard, and the
    # path-containment helper (blue_data.server / blue_data.core.utils). #75 / XR-08.
    "blue-data[server]>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
redis  = ["redis[hiredis]>=4.5.0"]
dev    = ["pytest", "httpx"]

[project.scripts]
blue-data-doc-api = "doc_api.main:run"

[tool.setuptools.packages.find]
where = ["src"]
