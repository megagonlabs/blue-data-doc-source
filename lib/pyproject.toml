[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-doc-source"
version = "0.1.0"
description = "Prototype document ingestion and retrieval source for Blue Data Intelligence"
authors = [
    {name = "Jalal Mahmud", email = "jalal@megagon.ai"},
]
maintainers = [
    {name = "Jalal Mahmud", email = "jalal@megagon.ai"},
]
requires-python = ">=3.10"
dependencies = [
    "blue-data>=0.1.0",
    "openai>=1.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "redis[hiredis]>=4.5.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
]
nlp = [
    "nltk>=3.8",
]
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-httpx>=0.30",
    "fpdf2>=2.7",
    "pdfplumber>=0.10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["blue_data_doc_source*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = [
    "integration: end-to-end tests requiring external services (Redis)",
]
