[project]
name = "blue-data-doc-source"
version = "0.1.0"
description = "Prototype document ingestion and retrieval source for Blue Data Intelligence"
requires-python = ">=3.10"
dependencies = [
    "blue-data @ file:../blue-data",
    "openai>=1.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "redis[hiredis]>=4.5.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
]
nlp = [
    "nltk>=3.8",
]

[tool.setuptools.packages.find]
where = ["lib/src"]
include = ["blue_doc_source*"]

[tool.pytest.ini_options]
testpaths = ["lib/tests/unit"]
markers = [
    "integration: end-to-end tests requiring external services (Redis)",
]